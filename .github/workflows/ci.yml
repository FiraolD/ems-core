name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ems
          POSTGRES_PASSWORD: ems
          POSTGRES_DB: ems
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ems"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PASSWORD: ems
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (in-memory SQLite)
        run: pytest
      - name: Tests (PostgreSQL, includes the audit-log trigger)
        run: pytest --ds=config.settings.dev
      - name: Django checks and migrations on PostgreSQL
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/Dockerfile -t ems:ci .
