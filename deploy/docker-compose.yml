# One client's installation: web app, background worker, PostgreSQL and Redis.
# Run from this folder:  cp .env.example .env  (edit it)  then  docker compose up -d --build
name: ems

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file: .env
  environment:
    EMS_CLIENT_CONFIG: /client/client.toml
    DB_HOST: db
    CELERY_BROKER_URL: redis://redis:6379/0
  volumes:
    # The client's folder (client.toml, extension package, templates, static files).
    - ${EMS_CLIENT_DIR:-../clients/_template}:/client:ro
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  web:
    <<: *app
    environment:
      EMS_CLIENT_CONFIG: /client/client.toml
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      EMS_RUN_MIGRATIONS: "true"
    ports:
      - "${EMS_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-ems}
      POSTGRES_USER: ${DB_USER:-ems}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
