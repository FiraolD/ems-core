<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ company.legal_name|default:"EMS" }}{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1f2933; background: #f5f7fa; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem;
             padding: .75rem 1rem; background: #1f3a5f; color: #fff; }
    header form { display: inline; margin: 0; }
    header button { background: transparent; color: #fff; border: 1px solid #fff; border-radius: 4px;
                    padding: .25rem .75rem; cursor: pointer; }
    main { max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
    .card { background: #fff; border-radius: 8px; padding: 1.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    input, button { font: inherit; }
    input[type=text], input[type=password], input[type=email] { width: 100%; box-sizing: border-box; padding: .5rem; }
    .card button { margin-top: 1rem; padding: .5rem 1.25rem; }
    .errorlist { color: #b42318; padding-left: 1rem; }
    .notice { background: #fff4e5; border-left: 4px solid #f59e0b; padding: .75rem 1rem; margin-bottom: 1rem; }
    .helptext, .muted { color: #52606d; font-size: .9rem; }
  </style>
</head>
<body>
  <header>
    <strong>{{ company.legal_name|default:"EMS" }}</strong>
    {% if user.is_authenticated %}
      <span>{{ user.get_username }}
        <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>
      </span>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
