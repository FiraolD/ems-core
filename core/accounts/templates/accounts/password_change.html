{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card">
  <h1>Change password</h1>
  {% if user.must_change_password %}
    <p class="notice">You must choose a new password before you can continue.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Change password</button>
  </form>
</div>
{% endblock %}
