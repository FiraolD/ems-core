{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card">
  <h1>Sign in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
  <p class="muted">Too many failed attempts will temporarily lock the account.</p>
</div>
{% endblock %}
